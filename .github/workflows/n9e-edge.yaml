name: "构建 Docker 镜像"

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "构建 Docker 镜像..."

      - name: "获取 Build 文件"
        uses: actions/checkout@v4

      - name: "获取当前工作目录"
        run: ls -la

      - name: "登录 Docker Hub"
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: "获取N9E文件"
        run: |
          ./n9e-edge/dockerfile/install.sh
